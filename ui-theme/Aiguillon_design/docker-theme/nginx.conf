server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location / { try_files $uri =404; add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=300"; }
  location ~* \.(css|json|png|svg)$ { try_files $uri =404; add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=86400"; }
}
